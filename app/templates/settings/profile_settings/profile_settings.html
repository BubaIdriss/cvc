{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WYTWPSTXQ9"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-WYTWPSTXQ9');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="bg-gray-100">
    <div class="max-w-4xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">
        <div class="flex flex-col items-center">
            {% if profile.profile_img %}
            <img class="w-32 h-32 rounded-full object-cover" src="{{ profile.profile_img.url }}" alt="Profile Image">
            {% else %}
            <img class="w-32 h-32 rounded-full object-cover" src="{% static 'img/cvc.png' %}" alt="Profile Image">
            {% endif %}
            <h1 class="text-2xl font-bold mt-4" style="color: aqua;">CVC/{{ profile.user.username }}</h1>
            <h3 class="text-2xl font-bold mt-4">{{ request.user.first_name }} {{ request.user.last_name }}</h3>
            <p class="text-gray-600">{{ profile.bio }}</p>
            <a href="{% url 'create_profile' %}" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded-lg">Edit
                Profile</a>
        </div>
    </div>
</body>

</html>
