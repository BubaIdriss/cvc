<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .cover-preview {
            width: 100%;
            height: 150px;
            background-color: #ddd;
            border-radius: 8px;
            object-fit: cover;
        }

        .profile-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: -50px;
            border: 3px solid white;
            background-color: #eee;
        }

        .input-group {
            margin: 15px 0;
            text-align: left;
        }

        label {
            font-weight: bold;
        }

        textarea,
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <center>
            {% for message in messages %}
            <p style="color: rgb(25, 180, 51);">{{ message }}</p>
            {% endfor %}
        </center>
        <br>
        <!-- Cover Image Preview -->
        <img id="coverPreview" class="cover-preview" src="" alt="Cover Preview">

        <!-- Profile Image Preview -->
        <img id="profilePreview" class="profile-preview" src="" alt="Profile Preview">

        <h2 class="text-2xl font-bold mb-4">{% if profile.bio %}Edit{% else %}Create{% endif %} Profile</h2>

        <form action="{% url 'create_profile' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- Cover Image Upload -->
            <div class="input-group">
                <label for="coverImage">Cover Image</label>
                <input type="file" id="coverImage" name="cover_img" accept="image/*">
            </div>

            <!-- Profile Image Upload -->
            <div class="input-group">
                <label for="profileImage">Profile Image</label>
                <input type="file" name="profile_img" id="profileImage" accept="image/*">
            </div>

            <!-- Bio -->
            <div class="input-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="3" maxlength="150"
                    placeholder="Write a short bio...">{{ profile.bio }}</textarea>
            </div>

            <!-- Date of Birth -->
            <div class="input-group">
                <label for="dob">Date of Birth</label>
                <input type="date" value="{{ profile.date_of_birth }}" id="dob" name="date_of_birth">
            </div>

            <button type="submit">Save Profile</button>
        </form>
    </div>

    <script>
        // Function to preview images
        function previewImage(input, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById(previewId).src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Event Listeners
        document.getElementById("coverImage").addEventListener("change", function () {
            previewImage(this, "coverPreview");
        });

        document.getElementById("profileImage").addEventListener("change", function () {
            previewImage(this, "profilePreview");
        });
    </script>
</body>

</html>
