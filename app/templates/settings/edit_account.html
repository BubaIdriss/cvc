{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="bg-gray-100">
    <div class="max-w-4xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Edit Account</h1>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <p
                class="text-white p-2 rounded {% if message.tags == 'success' %} bg-green-500 {% else %} bg-red-500 {% endif %}">
                {{ message }}
            </p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <label class="block font-medium">Registration Number</label>
            <input type="text" name="username" value="{{ request.user.username }}" class="w-full border rounded-lg p-2"
                disabled>

            <label class="block font-medium">Email</label>
            <input type="email" name="email" value="{{ request.user.email }}" class="w-full border rounded-lg p-2">

            <label class="block font-medium">First Name</label>
            <input type="text" name="first_name" value="{{ request.user.first_name }}"
                class="w-full border rounded-lg p-2">

            <label class="block font-medium">Last Name</label>
            <input type="text" name="last_name" value="{{ request.user.last_name }}"
                class="w-full border rounded-lg p-2">

            <label class="block font-medium">New Password (optional)</label>
            <input type="password" name="password" class="w-full border rounded-lg p-2">

            <label class="block font-medium">Confirm Password</label>
            <input type="password" name="confirm_password" class="w-full border rounded-lg p-2">

            <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg">Update Account</button>
        </form>
    </div>
</body>

</html>
